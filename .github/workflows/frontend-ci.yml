name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:run
      - name: Build and type-check
        run: npm run build
      - name: Verify dependency manifests are unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Record validation scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This job runs locked frontend installation, Vitest, and the production/type-checked build.
          Step results above determine success. Java/Floci, PowerShell, deployed native Lambda,
          and browser media/seek acceptance are outside this job; a green result does not verify them.
          SUMMARY
